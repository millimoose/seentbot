node_modules:
  commands:
    - bun

pre-commit:
  parallelize: true
  commands:
    - name: lint
      run: direnv exec . bun run lint --fix
      stage: pre-commit
    - name: typecheck
      run: direnv exec . bun run typecheck
      stage: pre-commit

pre-push:
  commands:
    - name: test
      run: direnv exec . bun run test
      stage: pre-push

retry:
  limit: 1

plugins:
  colors: always